# Nome do Workflow
name: Generate Snake Animation

# Gatilhos: Quando a Action deve rodar
on:
  # Roda automaticamente a cada 12 horas
  schedule:
    - cron: '0 */12 * * *'
  # Permite que você rode manualmente pela aba Actions
  workflow_dispatch:

# Tarefas a serem executadas
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Faz o checkout do seu repositório para que a Action possa escrever nele
      - uses: actions/checkout@v3

      # Gera a animação
      - uses: Platane/snk@v3
        with:
          # O seu nome de usuário do GitHub
          github_user_name: ${{ github.repository_owner }}

          # Lista de arquivos a serem gerados
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Faz o commit do arquivo gerado para o repositório
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "chore: generate snake animation"
          git push
