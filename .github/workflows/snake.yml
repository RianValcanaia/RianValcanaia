name: Generate snake animation

on:
  # Roda a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main 

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            # Versão para o tema claro (fundo claro, quadradinhos cinza claro)
            dist/snake-light.svg?color_snake=#FF0000&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            
            # Versão para o tema escuro (fundo escuro, quadradinhos cinza escuro)
            dist/snake-dark.svg?palette=github-dark&color_snake=#FF0000
            
      - name: Push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
