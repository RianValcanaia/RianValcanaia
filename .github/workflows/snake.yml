name: Generate Snake Animation

on:
  # Roda a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"

  # Roda a cada push no branch main/master para atualização instantânea
  push:
    branches:
      - main # ou master, dependendo do nome do seu branch principal
  
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
      
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation files
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#000000
            dist/github-contribution-grid-snake.svg?palette=github&color_snake=#000000

      - name: Push snake animation files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
