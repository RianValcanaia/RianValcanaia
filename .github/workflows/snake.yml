name: Generate Snake Animation

on:
  # Roda a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"

  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
      
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animation files
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=#339A3E&color_dots=#17381A,#206024,#339A3E,#47c44d&color_bg=#0d1117
            dist/github-contribution-grid-snake.svg?color_snake=#339A3E&color_dots=#17381A,#206024,#339A3E,#47c44d&color_bg=#ffffff

  
      - name: Push snake animation files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:

          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
